name: CI

on:
  push:
  pull_request:
    branches: ["unstable", "develop", "main"]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: trinacria
          MONGO_INITDB_ROOT_PASSWORD: trinacria
          MONGO_INITDB_DATABASE: trinacria_cms
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.adminCommand('ping').ok\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      MONGO_URI: mongodb://trinacria:trinacria@127.0.0.1:27017/trinacria_cms?authSource=admin
      TRINACRIA_RUN_MONGO_INTEGRATION: "1"
      TRINACRIA_RUN_S3_INTEGRATION: "1"
      TRINACRIA_S3_ENDPOINT: http://127.0.0.1:9000
      TRINACRIA_S3_ACCESS_KEY: trinacria
      TRINACRIA_S3_SECRET_KEY: trinacria-secret
      TRINACRIA_S3_BUCKET: trinacria-media-ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Format
        run: npm run format

      - name: Lint
        run: npm run lint:affected

      - name: Typecheck
        run: npm run typecheck:affected

      - name: Build
        run: npm run build:affected

      - name: Storybook build
        run: npm run storybook:build

      - name: SDK generated check
        run: npm run sdk:check

      - name: Start S3-compatible storage
        run: >-
          docker run --detach --rm --name trinacria-minio
          --publish 9000:9000
          --env MINIO_ROOT_USER=trinacria
          --env MINIO_ROOT_PASSWORD=trinacria-secret
          minio/minio:RELEASE.2025-09-07T16-13-09Z
          server /data

      - name: Wait for S3-compatible storage
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs trinacria-minio
          exit 1

      - name: Unit tests
        run: npm run test:affected

      - name: Integration tests
        run: npm run test:integration:affected

      - name: Workspace dependency graph
        run: npm run dependencies:check

      - name: Install E2E browser
        run: npx playwright install --with-deps chromium

      - name: Production-readiness E2E
        run: npm run e2e:ci

      - name: Upload E2E report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
