name: CI

on:
  push:
  pull_request:
    branches: ["unstable", "develop", "main"]

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      MONGO_URI: mongodb://trinacria:trinacria@127.0.0.1:27017/trinacria_cms?authSource=admin
      TRINACRIA_RUN_MONGO_INTEGRATION: "1"
      TRINACRIA_RUN_S3_INTEGRATION: "1"
      TRINACRIA_RUN_REDIS_INTEGRATION: "1"
      TRINACRIA_REDIS_URI: redis://127.0.0.1:6379
      TRINACRIA_S3_ENDPOINT: http://127.0.0.1:9000
      TRINACRIA_S3_ACCESS_KEY: trinacria
      TRINACRIA_S3_SECRET_KEY: trinacria-secret
      TRINACRIA_S3_BUCKET: trinacria-media-ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Setup npm
        run: npm install --global npm@11.16.0

      - name: Start Mongo replica set
        run: docker compose up --detach --wait mongo

      - name: Install
        run: npm ci

      - name: Install browser for distribution and E2E tests
        run: npx playwright install --with-deps chromium

      - name: Format
        run: npm run format

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Storybook build
        run: npm run storybook:build

      - name: Public API contracts
        run: npm run build && npm run public-api:check

      - name: External tarball backend and admin
        run: npm run release:test

      - name: SDK generated check
        run: npm run sdk:check

      - name: Setup Go for S3 test server
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false

      - name: Build S3-compatible test server
        env:
          GOBIN: ${{ runner.temp }}/minio-bin
        # Official MinIO RELEASE.2025-09-07T16-13-09Z, pinned to its source commit.
        run: go install github.com/minio/minio@07c3a429bfed433e49018cb0f78a52145d4bedeb

      - name: Start S3-compatible storage
        env:
          MINIO_ROOT_USER: trinacria
          MINIO_ROOT_PASSWORD: trinacria-secret
        run: |
          mkdir -p "$RUNNER_TEMP/minio-data"
          nohup "$RUNNER_TEMP/minio-bin/minio" server "$RUNNER_TEMP/minio-data" \
            > "$RUNNER_TEMP/minio.log" 2>&1 &

      - name: Start Redis
        run: >-
          docker run --detach --rm --name trinacria-redis
          --publish 6379:6379 redis:7-alpine

      - name: Wait for S3-compatible storage
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/minio.log"
          exit 1

      - name: Unit tests
        run: npm run test

      - name: Integration tests
        run: npm run test:integration -- --concurrency=1

      - name: First-run installer with real Mongo
        run: npm run test -w @trinacria-cms/playground

      - name: Plugin package boundaries
        run: npm run boundaries:check

      - name: Workspace dependency graph
        run: npm run dependencies:check

      - name: Signing and starter template consistency
        run: npm run signing:check && npm run template:check

      - name: Production-readiness E2E
        run: npm run e2e:ci

      - name: Upload E2E report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload distribution and recovery evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: cms-foundation-evidence
          # Only the explicitly listed redacted reports are uploaded from .tmp.
          include-hidden-files: true
          path: |
            .tmp/release/external-host-result.json
            .tmp/release/catalog-conformance-result.json
            test-results/durable-queue-diagnostics.json
          retention-days: 14
