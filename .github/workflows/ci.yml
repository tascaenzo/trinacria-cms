name: CI

on:
  push:
    branches: ["unstable", "develop", "main"]
  pull_request:
    branches: ["develop", "main"]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: trinacria
          MONGO_INITDB_ROOT_PASSWORD: trinacria
          MONGO_INITDB_DATABASE: trinacria_cms
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.adminCommand('ping').ok\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      MONGO_URI: mongodb://trinacria:trinacria@127.0.0.1:27017/trinacria_cms?authSource=admin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Format
        run: npm run format

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: SDK generated check
        run: npm run sdk:check

      - name: Unit tests
        run: npm run test

      - name: Integration tests
        run: npm run test:integration
